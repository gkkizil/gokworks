name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/windows-build-request.json

permissions:
  contents: write
  actions: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request:
    name: Read EXE build request
    runs-on: ubuntu-latest
    outputs:
      cancelled: ${{ steps.request.outputs.cancelled }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        shell: python
        run: |
          import json, os
          request = json.load(open('packaging/windows-build-request.json', encoding='utf-8'))
          cancelled = request.get('cancelled') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('cancelled=' + str(cancelled).lower() + '\n')
          print('EXE build cancelled by user; no executable will be produced.' if cancelled else 'EXE build requested.')
  build:
    needs: request
    if: needs.request.outputs.cancelled != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/windows-requirements.txt
      - name: Verify requested source validation
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/verify_build_request.py
      - name: Read requested previous failure diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $request = Get-Content packaging/windows-build-request.json -Raw | ConvertFrom-Json
          if ($request.diagnose_run) {
            gh run view $request.diagnose_run --repo $env:GITHUB_REPOSITORY --log-failed *> windows-previous-failure.log
            gh run download $request.diagnose_run --repo $env:GITHUB_REPOSITORY --pattern 'Windows-build-log-*' --dir previous-windows *>> windows-previous-failure.log
            if ($LASTEXITCODE -eq 0) {
              $env:BUILD_STATUS = 'building'
              python packaging/publish_status.py
            }
          }
          exit 0
      - name: Configure native desktop for wide layout checks
        run: python packaging/configure_windows_display.py
      - name: Install build dependencies
        id: dependencies
        run: |
          python -m pip install -r packaging/windows-requirements.txt *> windows-setup.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-setup.log; exit $LASTEXITCODE }
      - name: Record build start on the source branch
        env:
          BUILD_STATUS: building
        run: python packaging/publish_status.py
      - name: Validate native Windows shaft bridge
        if: steps.validation.outputs.full == 'true'
        timeout-minutes: 3
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r requirements-dev.txt *> windows-test-setup.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-test-setup.log; exit $LASTEXITCODE }
          $directory=Join-Path $env:RUNNER_TEMP 'gokworks-shaft-interop'
          python packaging/prepare_shaft_test_refs.py $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOKWORKS_SHAFT_TEST_INTEROP=Join-Path $directory 'SolidWorks.Interop.sldworks.dll'
          "GOKWORKS_SHAFT_TEST_INTEROP=$env:GOKWORKS_SHAFT_TEST_INTEROP" >> $env:GITHUB_ENV
          python -m pytest -vv -s modules/shaft_generator/tests/test_windows_transport.py *> windows-shaft-bridge.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-shaft-bridge.log; exit $LASTEXITCODE }
      - name: Validate native Windows background preview lifecycle
        if: steps.validation.outputs.full == 'true'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: windows
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r requirements-dev.txt *> windows-test-setup.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-test-setup.log; exit $LASTEXITCODE }
          foreach ($iteration in 1..5) {
            Write-Output "Background preview lifecycle check $iteration/5"
            python packaging/run_windows_tests.py tests/test_qt_workflows.py::test_naming_plan_filesystem_checks_are_off_gui_thread tests/test_qt_workflows.py::test_naming_immediate_preview_consumes_pending_debounce tests/test_qt_workflows.py::test_naming_closed_window_cannot_start_deferred_preview
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validate native Windows transfer columns
        if: steps.validation.outputs.full == 'true'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: windows
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r requirements-dev.txt *> windows-test-setup.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-test-setup.log; exit $LASTEXITCODE }
          python packaging/run_windows_tests.py tests/test_compact_workspaces_gui.py::test_transfer_columns_keep_sources_left_results_right_and_commands_visible
      - name: Validate native Windows nesting tabs and PDF text
        if: steps.validation.outputs.full == 'true'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: windows
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r requirements-dev.txt *> windows-test-setup.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-test-setup.log; exit $LASTEXITCODE }
          python packaging/run_windows_tests.py modules/nesting/tests/test_nesting_gui.py modules/nesting/tests/test_nesting_pdf_report.py
      - name: Validate native Windows shaft layout
        if: steps.validation.outputs.full == 'true'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: windows
          PYTHONUTF8: '1'
        run: python packaging/run_windows_tests.py modules/shaft_generator/tests/test_ui.py
      - name: Validate native Windows DXF preview shutdown
        # Check the native preview teardown before starting the long full suite.
        if: steps.validation.outputs.full == 'true'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: windows
          PYTHONUTF8: '1'
        run: python packaging/run_windows_tests.py modules/dxf_dwg/tests/test_preview_ui.py
      - name: Validate regression suite on Windows
        if: steps.validation.outputs.full == 'true'
        timeout-minutes: 32
        env:
          QT_QPA_PLATFORM: windows
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r requirements-dev.txt *> windows-test-setup.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-test-setup.log; exit $LASTEXITCODE }
          python packaging/run_windows_tests.py tests/test_qt_workflows.py::test_close_at_preview_completion_does_not_start_queued_cad_write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/run_windows_tests.py modules/tolerance_stack/tests/test_tolerance_stack_gui.py::test_invalid_advanced_input_targets_its_field_and_does_not_leak_into_a_new_analysis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/run_windows_tests.py modules/bolt_torque/tests/test_bolt_torque_gui.py::test_compact_wide_layout_and_copy_remain_accessible modules/nesting/tests/test_nesting_gui.py::test_steps_and_result_stay_accessible_without_clipping_after_resize_and_themes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/run_windows_tests.py
      - name: Validate focused packaging and raw COM boundaries
        if: steps.validation.outputs.reuse == 'true'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -m pip install -r requirements-dev.txt *> windows-test-setup.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-test-setup.log; exit $LASTEXITCODE }
          python packaging/run_windows_tests.py modules/dxf_dwg/tests/test_dxf_dwg.py modules/dxf_dwg/tests/test_preview_source.py tests/test_build_request_validation.py tests/test_single_file_distribution.py
      - name: Build and open the packaged EXE
        run: python packaging/build_windows.py *> windows-build.log
      - name: Upload single executable
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOKWORKS-Tek-EXE-Windows-x64-${{ github.sha }}
          path: dist/GOKWORKS.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct EXE download
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-onefile-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          gh release create $tag dist/GOKWORKS.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "GOKWORKS Windows - Tek EXE" --prerelease --notes-file dist/release-notes.md *> windows-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "download_url=https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/GOKWORKS.exe" >> $env:GITHUB_OUTPUT
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-log-${{ github.sha }}
          path: |
            windows-build.log
            windows-release.log
            windows-setup.log
            windows-test-setup.log
            windows-shaft-bridge.log
            windows-previous-failure.log
            dist/windows-smoke*.json
            dist/windows-smoke*.png
            dist/SHA256.txt
            dist/OKU.txt
            windows-tests.xml
            windows-tests.log
            windows-qt-native.log
            windows-display.json
            windows-reused-validation.json
          if-no-files-found: ignore
      - name: Record downloadable build status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          DIRECT_EXE_URL: ${{ steps.release.outputs.download_url }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_SETUP_OUTCOME: ${{ steps.python.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
        run: python packaging/publish_status.py
