name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, codex/pyside6-migration]
    paths:
      - packaging/windows-build-request.json

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/windows-requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r packaging/windows-requirements.txt
      - name: Record build start on the source branch
        env:
          BUILD_STATUS: building
        run: python packaging/publish_status.py
      - name: Validate regression suite on Windows
        timeout-minutes: 12
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r requirements-dev.txt
          python packaging/run_windows_tests.py tests/test_tolerance_stack_gui.py::test_invalid_advanced_input_targets_its_field_and_does_not_leak_into_a_new_analysis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/run_windows_tests.py
      - name: Build and open the packaged EXE
        run: python packaging/build_windows.py *> windows-build.log
      - name: Upload single executable
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOKWORKS-Tek-EXE-Windows-x64-${{ github.sha }}
          path: dist/GOKWORKS.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct EXE download
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-onefile-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          gh release create $tag dist/GOKWORKS.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "GOKWORKS Windows - Tek EXE" --prerelease --notes-file dist/release-notes.md *> windows-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "download_url=https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/GOKWORKS.exe" >> $env:GITHUB_OUTPUT
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-log-${{ github.sha }}
          path: |
            windows-build.log
            windows-release.log
            dist/windows-smoke*.json
            dist/windows-smoke*.png
            dist/SHA256.txt
            dist/OKU.txt
            windows-tests.xml
            windows-tests.log
          if-no-files-found: ignore
      - name: Record downloadable build status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          DIRECT_EXE_URL: ${{ steps.release.outputs.download_url }}
        run: python packaging/publish_status.py
