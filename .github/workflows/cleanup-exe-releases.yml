name: Remove published EXE releases and tags

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-exe-releases.yml']

permissions:
  contents: write
  actions: read

jobs:
  cleanup:
    if: github.repository == 'gkkizil/gokworks' && github.event.head_commit.message == 'Remove published EXE releases and build tags'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the user-requested releases and tags, then verify both lists are empty
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, subprocess
          from urllib.parse import quote
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'gkkizil/gokworks'
          def api(path, delete=False, paginate=False):
              command = ['gh', 'api', 'repos/' + repository + '/' + path]
              if delete:
                  command += ['--method', 'DELETE']
              elif paginate:
                  command += ['--paginate', '--slurp']
              result = subprocess.check_output(command, text=True)
              return json.loads(result) if result.strip() else None
          def listing(path):
              return [item for page in api(path, paginate=True) for item in page]
          runs = api('actions/workflows/windows-exe.yml/runs?per_page=100')['workflow_runs']
          assert not any(run['status'] != 'completed' for run in runs), 'An EXE publication is still active.'
          releases = listing('releases?per_page=100')
          tags = listing('git/matching-refs/tags?per_page=100')
          print(json.dumps({'release_inventory': [{'id': r['id'], 'tag': r['tag_name'],
                'assets': [a['name'] for a in r['assets']]} for r in releases],
                'tag_inventory': [{'ref': t['ref'], 'sha': t['object']['sha']} for t in tags]}), flush=True)
          for release in releases:
              assert type(release['id']) is int
              api('releases/' + str(release['id']), delete=True)
              print('Deleted release ' + release['tag_name'], flush=True)
          for tag in tags:
              assert tag['ref'].startswith('refs/tags/')
              api('git/' + quote(tag['ref'], safe='/'), delete=True)
              print('Deleted ' + tag['ref'], flush=True)
          assert not listing('releases?per_page=100'), 'Releases remain.'
          assert not listing('git/matching-refs/tags?per_page=100'), 'Tags remain.'
          message = f"Removed {len(releases)} releases with all assets and {len(tags)} tags. Both lists are empty; branches were not modified."
          print('::notice::' + message, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(message + '\n')
