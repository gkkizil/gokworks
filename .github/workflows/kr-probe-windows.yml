name: K-R standalone Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - k_factor/standalone/windows-build-request.json

permissions:
  contents: write

concurrency:
  group: kr-probe-windows-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/kr-windows-requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Install standalone build dependencies
        run: python -m pip install -r packaging/kr-windows-requirements.txt
      - name: Build both engines and open the frozen GUI
        run: python packaging/build_kr_windows.py *> kr-windows-build.log
      - name: Upload standalone Windows package
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOKWORKS-KR-Deneme-Windows-x64-${{ github.sha }}
          path: dist/kr-probe/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KR-Windows-build-log-${{ github.sha }}
          path: |
            kr-windows-build.log
            dist/kr-probe/windows-smoke.json
          if-no-files-found: ignore
      - name: Record standalone download on main
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python packaging/publish_kr_status.py
