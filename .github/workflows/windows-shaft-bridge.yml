name: Windows shaft bridge

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['modules/shaft_generator/**', 'modules/dxf_dwg/**', 'modules/profile_cutting/**', 'tests/support/solidworks.py', 'packaging/prepare_shaft_test_refs.py', '.github/workflows/windows-shaft-bridge.yml']
  pull_request:
    paths: ['modules/shaft_generator/**', 'modules/dxf_dwg/**', 'modules/profile_cutting/**', 'tests/support/solidworks.py', 'packaging/prepare_shaft_test_refs.py', '.github/workflows/windows-shaft-bridge.yml']

permissions:
  contents: read

jobs:
  native-transport:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install pytest==9.0.2
      - name: Verify offline DIN catalogue and nominal data contract
        run: python -m pytest -q modules/shaft_generator/tests/test_standards.py modules/shaft_generator/tests/test_axial_features.py modules/shaft_generator/tests/test_edge_treatments.py
      - name: Stage temporary compile references (never packaged)
        run: |
          $directory=Join-Path $env:RUNNER_TEMP 'gokworks-shaft-interop'
          python packaging/prepare_shaft_test_refs.py $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GOKWORKS_SHAFT_TEST_INTEROP=$directory\SolidWorks.Interop.sldworks.dll" >> $env:GITHUB_ENV
      - name: Exercise real PowerShell loader and pipes without SOLIDWORKS
        run: |
          python -m pytest -vv -s modules/shaft_generator/tests/test_windows_transport.py modules/shaft_generator/tests/test_channel_selection.py modules/shaft_generator/tests/test_axial_transport.py --junitxml windows-shaft-tests.xml
          $testExit=$LASTEXITCODE
          if ($testExit -ne 0) {
          @'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path=Path('windows-shaft-tests.xml')
          if path.exists():
              for case in ET.parse(path).iter('testcase'):
                  for failure in list(case.findall('failure'))+list(case.findall('error')):
                      text=case.get('name','')+': '+(failure.text or failure.get('message',''))[-10000:]
                      text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::error::'+text)
          '@ | python -
          }
          exit $testExit
