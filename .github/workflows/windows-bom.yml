name: Windows BOM and shaft UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/bom/**'
      - 'modules/dxf_dwg/**'
      - 'tests/support/solidworks.py'
      - 'modules/shaft_generator/ui.py'
      - 'modules/shaft_generator/tests/test_ui.py'
      - 'modules/shaft_generator/interop/**'
      - '.github/workflows/windows-bom.yml'
  pull_request:
    paths:
      - 'modules/bom/**'
      - 'modules/dxf_dwg/**'
      - 'tests/support/solidworks.py'
      - 'modules/shaft_generator/ui.py'
      - 'modules/shaft_generator/tests/test_ui.py'
      - 'modules/shaft_generator/interop/**'
      - '.github/workflows/windows-bom.yml'

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure native Windows display
        run: python packaging/configure_windows_display.py
      - name: Test DXF save/preview/stop, BOM images and shaft UI without licensed CAD
        run: |
          python packaging/run_windows_tests.py modules/dxf_dwg/tests modules/bom/tests modules/shaft_generator/tests/test_ui.py tests/test_qt_workflows.py::test_bom_hierarchy_missing_mass_filter_copy_and_complete_excel tests/test_qt_workflows.py::test_bom_clear_button_empties_both_views_and_pending_filters
          $testExit=$LASTEXITCODE
          @'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path=Path('windows-tests.xml')
          if path.exists():
              suites=list(ET.parse(path).iter('testsuite'))
              summary={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
              print('::notice::Windows BOM/UI verification: '+str(summary)+'; licensed SOLIDWORKS was not run.')
              for case in ET.parse(path).iter('testcase'):
                  for failure in list(case.findall('failure'))+list(case.findall('error')):
                      text=case.get('name','')+': '+(failure.text or failure.get('message',''))[-10000:]
                      print('::error::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          '@ | python -
          exit $testExit
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-BOM-UI-tests
          path: |
            windows-tests.xml
            windows-tests.log
